<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
  <title>实验1b｜智驾乘车体验（成人版）</title>

  <!-- 与实验3a保持相同的本地 jsPsych 目录结构 -->
  <script src="jspsych/jspsych.js"></script>
  <script src="plugins/plugin-html-keyboard-response.js"></script>
  <link rel="stylesheet" href="jspsych/jspsych.css">

  <style>
    :root {
      --bg:#1e1e24;
      --panel:#2b2b36;
      --panel-deep:#15151a;
      --line:#444;
      --text:#e8e8ea;
      --muted:#aeb7c2;
      --blue:#64b5f6;
      --green:#4CAF50;
      --orange:#FF9800;
      --warning:#ffb74d;
    }

    html, body {
      width:100%;
      min-height:100%;
      margin:0;
      padding:0;
      background:var(--bg);
      color:var(--text);
      font-family:"Microsoft YaHei","PingFang SC",sans-serif;
      overflow-x:hidden;
      overflow-y:auto;
      -webkit-overflow-scrolling:touch;
      -webkit-text-size-adjust:100%;
      text-size-adjust:100%;
      user-select:none;
    }

    button, input, select { touch-action:manipulation; font-family:inherit; }
    button { -webkit-tap-highlight-color: transparent; }

    #login-screen, #jspsych-target { width:100%; min-height:100dvh; }
    .hidden { display:none !important; }

    .jspsych-display-element {
      background:var(--bg);
      color:var(--text);
      min-height:100dvh;
      overflow-x:hidden;
      overflow-y:auto;
      -webkit-overflow-scrolling:touch;
    }
    .jspsych-content-wrapper {
      width:100%;
      min-height:100dvh;
      height:auto;
      padding:0;
      box-sizing:border-box;
      justify-content:center;
      align-items:center;
    }
    .jspsych-content { width:100%; max-width:none; }

    .fullscreen-container {
      width:100%;
      min-height:100dvh;
      height:auto;
      display:flex;
      flex-direction:column;
      justify-content:center;
      align-items:center;
      box-sizing:border-box;
      padding:18px 0;
    }

    .guide-box {
      width:min(920px,90vw);
      background:var(--panel);
      border:1px solid var(--line);
      border-radius:14px;
      padding:36px 48px;
      box-sizing:border-box;
      font-size:20px;
      line-height:1.8;
      text-align:left;
    }
    .guide-title {
      text-align:center;
      color:var(--blue);
      font-size:32px;
      font-weight:800;
      margin-bottom:24px;
    }
    .context-box {
      background:#383846;
      border-left:5px solid var(--warning);
      border-radius:6px;
      padding:16px 22px;
      margin-bottom:20px;
      font-size:18px;
      line-height:1.7;
    }
    .highlight { color:var(--warning); font-weight:800; }
    .ability-text { color:var(--green); font-weight:800; }
    .emotion-text { color:var(--orange); font-weight:800; }

    .continue-btn, .action-btn, .login-btn {
      min-width:180px;
      min-height:52px;
      padding:11px 28px;
      border:0;
      border-radius:10px;
      background:var(--green);
      color:white;
      font-size:19px;
      font-weight:800;
      cursor:pointer;
    }
    .continue-btn:disabled, .action-btn:disabled { opacity:.4; cursor:not-allowed; }

    /* ---------- 测试版登录 ---------- */
    .login-box {
      width:min(560px,90vw);
      background:var(--panel);
      border:1px solid var(--line);
      border-radius:14px;
      padding:38px 34px;
      text-align:center;
      box-sizing:border-box;
    }
    .login-title { color:var(--blue); font-weight:800; font-size:30px; margin-bottom:16px; }
    .login-sub { color:var(--muted); font-size:15px; line-height:1.65; margin-bottom:18px; }
    .login-input, .risk-select {
      width:min(360px,78vw);
      box-sizing:border-box;
      background:var(--panel-deep);
      color:white;
      border:2px solid var(--blue);
      border-radius:9px;
      padding:11px 12px;
      font-size:20px;
      text-align:center;
      outline:none;
      margin-bottom:14px;
    }
    .dev-note {
      width:min(420px,82vw);
      margin:0 auto 18px;
      padding:10px 12px;
      border-radius:8px;
      background:#33291d;
      border:1px solid #76582d;
      color:#ffd69a;
      font-size:13px;
      line-height:1.5;
      text-align:left;
    }

    /* ---------- 点数分配 ---------- */
    .allocation-wrap {
      display:flex;
      gap:28px;
      justify-content:center;
      align-items:stretch;
      margin:22px 0;
    }
    .allocation-card {
      width:310px;
      padding:22px;
      border-radius:12px;
      background:var(--panel-deep);
      border:1px solid var(--line);
      text-align:center;
      box-sizing:border-box;
    }
    .allocation-card.ability { border-top:5px solid var(--green); }
    .allocation-card.emotion { border-top:5px solid var(--orange); }
    .allocation-score { font-size:52px; font-weight:900; margin:12px 0; }
    .allocation-controls { display:flex; justify-content:center; gap:16px; }
    .mini-btn {
      width:58px;
      height:48px;
      border-radius:9px;
      border:1px solid #666;
      background:#383846;
      color:white;
      font-size:28px;
      font-weight:800;
      cursor:pointer;
    }
    .mini-btn:disabled { opacity:.3; cursor:not-allowed; }

    /* ---------- 四助手介绍 ---------- */
    .assistant-intro-grid {
      width:min(1050px,92vw);
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:16px;
    }
    .assistant-intro-card {
      background:var(--panel);
      border:1px solid var(--line);
      border-radius:12px;
      padding:16px 18px;
      display:grid;
      grid-template-columns:92px 1fr;
      gap:15px;
      align-items:center;
      box-sizing:border-box;
    }
    .avatar-box {
      width:88px;
      height:88px;
      border-radius:14px;
      background:#20212a;
      border:1px solid #4b4b56;
      display:flex;
      align-items:center;
      justify-content:center;
      overflow:hidden;
      flex:0 0 auto;
    }
    .avatar-box img { width:88%; height:88%; object-fit:contain; display:block; }
    .avatar-fallback { display:none; align-items:center; justify-content:center; font-size:48px; width:100%; height:100%; }
    .assistant-intro-title { font-size:22px; font-weight:900; margin-bottom:7px; }
    .state-row { display:flex; flex-direction:column; align-items:flex-start; gap:7px; }
    .state-label { font-size:16px; font-weight:800; }
    .energy-bars { display:flex; gap:8px; align-items:center; }
    .energy-cell {
      width:58px;
      height:20px;
      border-radius:6px;
      border:2px solid #717985;
      box-sizing:border-box;
      background:rgba(255,255,255,.04);
    }
    .energy-cell.ability.on { background:var(--green); border-color:var(--green); box-shadow:0 0 9px rgba(76,175,80,.32); }
    .energy-cell.emotion.on { background:var(--orange); border-color:var(--orange); box-shadow:0 0 9px rgba(255,152,0,.32); }
    .assistant-note { color:var(--muted); font-size:14px; line-height:1.5; margin-top:7px; }

    /* ---------- Trial ---------- */
    .trial-shell {
      width:100%;
      height:100dvh;
      min-height:100dvh;
      display:flex;
      flex-direction:column;
      overflow:hidden;
      box-sizing:border-box;
      background:var(--bg);
    }
    .trial-header {
      flex:0 0 6%;
      min-height:42px;
      width:100%;
      background:var(--panel-deep);
      border-bottom:1px solid #333;
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding:5px clamp(12px,4vw,50px);
      box-sizing:border-box;
      color:var(--muted);
      font-size:clamp(12px,1vw,16px);
    }
    .scene-zone {
      flex:0 0 36%;
      min-height:210px;
      display:flex;
      align-items:center;
      justify-content:center;
      background:var(--panel-deep);
      padding:6px 0;
      box-sizing:border-box;
    }
    .scene-image-frame {
      position:relative;
      width:min(94vw,720px);
      aspect-ratio:637/315;
      max-height:100%;
      border-radius:9px;
      overflow:hidden;
      background:#101116;
      box-shadow:0 4px 16px rgba(0,0,0,.45);
      display:flex;
      align-items:center;
      justify-content:center;
    }
    .scene-image { width:100%; height:100%; object-fit:contain; display:block; }
    .scene-load-hint {
      position:absolute;
      inset:0;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:14px;
      text-align:center;
      color:var(--muted);
      background:#101116;
      font-size:15px;
      z-index:2;
    }

    .assistant-zone {
      flex:0 0 31%;
      min-height:188px;
      display:flex;
      align-items:center;
      justify-content:center;
      background:var(--bg);
      border-top:1px solid #35353e;
      border-bottom:1px solid #45454e;
      padding:7px 12px;
      box-sizing:border-box;
    }
    .assistant-info-card {
      width:min(920px,94vw);
      height:calc(100% - 4px);
      max-height:230px;
      min-height:166px;
      background:var(--panel);
      border:1px solid #4b4b56;
      border-radius:13px;
      display:grid;
      grid-template-columns:112px 1fr;
      gap:18px;
      padding:14px 20px;
      box-sizing:border-box;
      align-items:center;
    }
    .assistant-info-card .avatar-box { width:104px; height:104px; }
    .assistant-info-right { min-width:0; }
    .assistant-badge { font-size:clamp(15px,1.25vw,20px); font-weight:900; color:white; margin-bottom:8px; }
    .formal-state-row { display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:10px; }
    .formal-state-label { font-size:clamp(14px,1vw,18px); font-weight:900; }
    .formal-text {
      background:#20212a;
      border:1px solid #484954;
      border-radius:9px;
      padding:10px 13px;
      font-size:clamp(14px,1.08vw,19px);
      line-height:1.55;
      color:#f0f0f0;
      overflow-wrap:anywhere;
    }

    .rating-zone {
      flex:1 1 27%;
      min-height:176px;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      background:var(--panel);
      padding:10px 8px calc(8px + env(safe-area-inset-bottom));
      box-sizing:border-box;
      overflow:hidden;
    }
    .rating-topline {
      width:min(760px,92vw);
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      min-height:28px;
    }
    .rating-progress { color:#9fa8b3; font-size:13px; }
    .rating-back {
      border:1px solid #666;
      border-radius:7px;
      background:#1f2028;
      color:#c8d2dc;
      min-height:34px;
      padding:5px 10px;
      font-size:12px;
      cursor:pointer;
    }
    .rating-back.hidden-visibility { visibility:hidden; pointer-events:none; }
    .rating-question {
      width:min(820px,94vw);
      text-align:center;
      font-size:clamp(18px,1.45vw,27px);
      line-height:1.35;
      font-weight:900;
      margin:5px 0 8px;
      color:#f3f3f3;
      overflow-wrap:anywhere;
    }
    .rating-options {
      display:grid;
      grid-template-columns:repeat(5,1fr);
      gap:12px;
      width:min(760px,92vw);
    }
    .rating-option {
      min-width:0;
      min-height:52px;
      border-radius:10px;
      border:2px solid #59616d;
      background:#1f2028;
      color:var(--blue);
      font-size:23px;
      font-weight:900;
      cursor:pointer;
    }
    .rating-option.selected {
      border-color:var(--green);
      background:rgba(76,175,80,.16);
      box-shadow:0 0 0 2px rgba(76,175,80,.14) inset;
    }
    .rating-option:disabled { opacity:.3; cursor:not-allowed; }
    .rating-anchors {
      width:min(760px,92vw);
      display:grid;
      grid-template-columns:1fr 1fr 1fr;
      margin-top:3px;
      color:#b8c4d1;
      font-size:14px;
    }
    .rating-anchors span:nth-child(1){text-align:left;}
    .rating-anchors span:nth-child(2){text-align:center;}
    .rating-anchors span:nth-child(3){text-align:right;}
    .rating-confirm {
      margin-top:7px;
      min-width:150px;
      min-height:42px;
      border:0;
      border-radius:9px;
      background:var(--green);
      color:white;
      font-size:16px;
      font-weight:900;
      cursor:pointer;
    }
    .rating-confirm:disabled { opacity:.4; cursor:not-allowed; }


    /* ---------- 助手提示气泡 ---------- */
    .assistant-prompt-label {
      display:inline-block;
      margin:0 0 5px 12px;
      padding:3px 9px;
      border-radius:999px;
      background:#343746;
      border:1px solid #565b69;
      color:#dce6f0;
      font-size:12px;
      font-weight:800;
      letter-spacing:.5px;
    }
    .speech-bubble {
      position:relative;
      background:#20212a;
      border:1px solid #555b67;
      border-radius:11px;
      padding:10px 13px;
      font-size:clamp(14px,1.08vw,19px);
      line-height:1.55;
      color:#f0f0f0;
      overflow-wrap:anywhere;
      box-shadow:0 2px 8px rgba(0,0,0,.16);
    }
    .speech-bubble::before {
      content:'';
      position:absolute;
      left:-9px;
      top:18px;
      width:16px;
      height:16px;
      background:#20212a;
      border-left:1px solid #555b67;
      border-bottom:1px solid #555b67;
      transform:rotate(45deg);
    }

    /* ---------- 结束 ---------- */
    .debug-data {
      width:min(820px,88vw);
      max-height:220px;
      overflow:auto;
      margin:16px auto;
      padding:10px;
      box-sizing:border-box;
      background:#111217;
      border:1px solid #444;
      border-radius:8px;
      color:#9eadba;
      font-size:11px;
      user-select:text;
      white-space:pre-wrap;
      text-align:left;
    }

    /* ---------- 平板 ---------- */
    @media (max-width:900px) {
      .guide-box { width:94vw; padding:24px; font-size:17px; }
      .guide-title { font-size:27px; }
      .assistant-intro-grid { width:94vw; gap:10px; }
      .assistant-intro-card { grid-template-columns:76px 1fr; padding:12px; }
      .avatar-box { width:72px; height:72px; }
      .energy-cell { width:43px; height:18px; }
      .assistant-info-card { width:96vw; grid-template-columns:96px 1fr; gap:12px; padding:11px 14px; }
      .assistant-info-card .avatar-box { width:88px; height:88px; }
      .rating-options { gap:8px; }
    }

    /* ---------- 手机竖屏 ---------- */
    @media (max-width:650px) {
      html,body,#login-screen,#jspsych-target,.jspsych-display-element { min-height:100svh; }
      .jspsych-content-wrapper { min-height:100svh; height:auto; align-items:flex-start; }
      .fullscreen-container {
        min-height:100svh;
        height:auto;
        justify-content:flex-start;
        padding:12px 0 calc(16px + env(safe-area-inset-bottom));
      }
      #login-screen.fullscreen-container { justify-content:center; }

      .guide-box { width:92vw; padding:16px 15px; font-size:15px; line-height:1.55; }
      .guide-title { font-size:23px; margin-bottom:12px; }
      .context-box { padding:10px 12px; font-size:14px; line-height:1.5; margin-bottom:10px; }
      .continue-btn,.action-btn,.login-btn { min-height:46px; min-width:150px; padding:8px 16px; font-size:16px; }

      .login-box { width:92vw; padding:22px 16px; }
      .login-title { font-size:24px; }
      .login-input,.risk-select { width:78vw; font-size:18px; }

      .allocation-wrap { width:100%; gap:8px; margin:12px 0; }
      .allocation-card { width:calc(50% - 4px); padding:11px 7px; }
      .allocation-score { font-size:38px; margin:7px 0; }
      .mini-btn { width:48px; height:42px; font-size:23px; }

      .assistant-intro-grid { grid-template-columns:1fr 1fr; width:92vw; gap:7px; }
      .assistant-intro-card { grid-template-columns:52px 1fr; gap:7px; padding:8px 7px; border-radius:9px; }
      .assistant-intro-card .avatar-box { width:50px; height:50px; border-radius:9px; }
      .assistant-intro-title { font-size:14px; margin-bottom:3px; }
      .state-label { font-size:11.5px; }
      .energy-bars { gap:4px; }
      .energy-cell { width:25px; height:11px; border-width:1.5px; border-radius:3px; }
      .assistant-note { font-size:10.5px; margin-top:3px; }

      .trial-shell {
        height:100svh;
        min-height:100svh;
        overflow-x:hidden;
        overflow-y:auto;
        -webkit-overflow-scrolling:touch;
        overscroll-behavior-y:contain;
        padding-bottom:env(safe-area-inset-bottom);
      }
      .trial-header { flex:0 0 5%; min-height:34px; padding:3px 9px; font-size:11px; }
      .scene-zone { flex:0 0 31%; min-height:165px; padding:3px 0; }
      .scene-image-frame { width:96vw; max-width:637px; }
      .assistant-zone { flex:0 0 34%; min-height:205px; padding:5px 6px; }
      .assistant-info-card {
        width:95vw;
        height:calc(100% - 2px);
        min-height:192px;
        max-height:none;
        grid-template-columns:68px 1fr;
        gap:8px;
        padding:8px 9px;
        border-radius:10px;
      }
      .assistant-info-card .avatar-box { width:64px; height:64px; border-radius:10px; }
      .assistant-badge { font-size:13px; margin-bottom:5px; }
      .formal-state-row { gap:7px; margin-bottom:6px; }
      .formal-state-label { font-size:12px; }
      .assistant-info-card .energy-cell { width:31px; height:13px; }
      .formal-text { padding:7px 8px; font-size:12.5px; line-height:1.42; }
      .assistant-prompt-label { margin:0 0 3px 8px; padding:2px 7px; font-size:10.5px; }
      .speech-bubble { padding:7px 8px; font-size:12.5px; line-height:1.42; border-radius:9px; }
      .speech-bubble::before { left:-7px; top:15px; width:12px; height:12px; }


      .rating-zone { flex:1 0 30%; min-height:176px; padding:6px 5px calc(6px + env(safe-area-inset-bottom)); }
      .rating-topline { width:94vw; min-height:29px; }
      .rating-progress { font-size:11px; }
      .rating-back { min-height:32px; font-size:10.5px; padding:4px 7px; }
      .rating-question { width:94vw; font-size:15px; line-height:1.35; margin:1px 0 5px; }
      .rating-options { width:94vw; gap:6px; }
      .rating-option { min-height:44px; padding:1px; font-size:19px; border-radius:8px; }
      .rating-anchors { width:94vw; font-size:10.5px; }
      .rating-confirm { min-height:40px; margin-top:5px; font-size:14px; }

      .trial-shell.adaptive-scroll {
        height:auto !important;
        min-height:100svh !important;
        overflow-y:auto !important;
      }
      .trial-shell.adaptive-scroll > * {
        flex:0 0 auto !important;
        height:auto !important;
        max-height:none !important;
        overflow:visible !important;
      }
      .trial-shell.adaptive-scroll .scene-zone { min-height:170px; }
      .trial-shell.adaptive-scroll .assistant-zone { min-height:0; padding:8px 6px; }
      .trial-shell.adaptive-scroll .assistant-info-card { height:auto; min-height:0; }
      .trial-shell.adaptive-scroll .rating-zone { min-height:0; padding-top:10px; padding-bottom:calc(10px + env(safe-area-inset-bottom)); }
    }

    @media (max-width:900px) and (orientation:landscape) {
      .trial-shell { min-height:100dvh; height:auto; overflow-y:auto; }
    }
  </style>
</head>
<body>

<div id="login-screen" class="fullscreen-container">
  <div class="login-box">
    <div class="login-title">进入智驾乘车体验</div>
    <div id="login-info" class="login-sub">请输入您在前置问卷中使用的匿名实验编号，以便匹配两部分数据。请勿填写姓名、手机号等个人信息。</div>
    <input id="subject-id-input" class="login-input" type="text" placeholder="例如：001" maxlength="30" autocomplete="off">
    <br>
    <button id="login-btn" class="login-btn">进入体验</button>
    <div class="dev-note" style="margin-top:16px;margin-bottom:0;">正式风险组不会由被试选择：系统通过 DataPipe 的两个 condition 自动平衡分配至低风险或高风险条件。</div>
  </div>
</div>

<div id="jspsych-target"></div>

<script>
  /* =========================================================
     实验1b 成人版正式候选版
     ---------------------------------------------------------
     核心框架：jsPsych
     数据传输：DataPipe -> OSF
     风险条件：DataPipe 2 conditions（0=Low, 1=High）
     正式顺序：全体被试共用 1 套固定伪随机序列
     正式试次：24 = 6场景 × 4助手条件
     ========================================================= */

  const ROBOT_IMAGE = 'img/robot.webp';
  const DATAPIPE_EXPERIMENT_ID = 'gpeEpIZdGAMh';
  const DATAPIPE_REQUIRED = true;
  const DATAPIPE_BASE = 'https://pipe.jspsych.org/api';
  const SEQUENCE_NAME = 'FixedSeq_v1';
  const IMAGE_FORMAT = 'lossless_webp';
  const AGE_GROUP = 'Adult';

  let currentSubjectId = '';
  let dataPipeCondition = null;
  let riskGroup = null;
  let currentVersion = '';
  let baselineAbility = null;

     1. DataPipe / OSF
     ========================================================= */
  function dataPipeConfigured(){
    return DATAPIPE_EXPERIMENT_ID && !DATAPIPE_EXPERIMENT_ID.startsWith('REPLACE_');
  }

  async function getDataPipeCondition(){
    if(!dataPipeConfigured()) throw new Error('DataPipe experiment ID 尚未配置。');

    // 同一浏览器会话中刷新页面时尽量复用已经取得的条件，
    // 避免同一被试因刷新而再次消耗一个 condition。
    const storageKey = `Exp1b_DP_Condition_${currentSubjectId}`;
    const cached = sessionStorage.getItem(storageKey);
    if(cached === '0' || cached === '1') return Number(cached);

    const response = await fetch(`${DATAPIPE_BASE}/condition/`, {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({experimentID:DATAPIPE_EXPERIMENT_ID})
    });
    const result = await response.json().catch(()=>({}));
    if(!response.ok || typeof result.condition !== 'number'){
      throw new Error(result.message || `DataPipe 条件分配失败（HTTP ${response.status}）`);
    }
    if(result.condition !== 0 && result.condition !== 1){
      throw new Error(`收到未预期的条件编号：${result.condition}。请确认 DataPipe 条件数设置为 2。`);
    }
    sessionStorage.setItem(storageKey, String(result.condition));
    return result.condition;
  }

  function pad2(n){ return String(n).padStart(2,'0'); }
  function pad3(n){ return String(n).padStart(3,'0'); }
  function formatLocalTimestamp(date=new Date()){
    return `${date.getFullYear()}${pad2(date.getMonth()+1)}${pad2(date.getDate())}_${pad2(date.getHours())}${pad2(date.getMinutes())}${pad2(date.getSeconds())}_${pad3(date.getMilliseconds())}`;
  }
  function buildUniqueDataFilename(){
    const safeSubject = String(currentSubjectId).replace(/[^a-zA-Z0-9_-]/g,'_');
    return `${formatLocalTimestamp(new Date())}_Exp1b_Adult_Subject${safeSubject}_${riskGroup}.csv`;
  }

  const CLEAN_CSV_COLUMNS = [
    'Subject_ID','Session_UUID','Age_Group','DataPipe_Condition','Version','Sequence',
    'Formal_Trial_Order','Block','Block_Position',
    'Image_Number','Image_ID','Image_File','Scene_ID','Scene_Name','Risk_Level',
    'Assistant_Label','Config_Code','Config_Type','Config_Name_CN',
    'Attribute_Dimension','Attribute_Level','Attribute_Level_Numeric','Manipulation_Text',
    'Trust_Score','Trust_RT_ms','Cooperation_Score','Cooperation_RT_ms','Back_to_Q1_Count','Total_Trial_Time_ms',
    'Experiment_Total_Time_ms','Formal_Total_Time_ms','Page_Hidden_Count','Page_Hidden_Total_ms',
    'Baseline_Ability_Points','Baseline_Emotion_Points','Browser_Context','User_Agent','Image_Format'
  ];

  function csvEscape(value){
    if(value === null || value === undefined) return '';
    const s = String(value);
    return /[",\r\n]/.test(s) ? `"${s.replace(/"/g,'""')}"` : s;
  }

  function buildCleanFormalCSV(){
    const rows = jsPsych.data.get().filter({Event_Type:'Formal_Trial'}).values();
    const sessionMetrics = {
      Experiment_Total_Time_ms: experimentTotalTimeMs(),
      Formal_Total_Time_ms: formalTotalTimeMs(),
      Page_Hidden_Count: pageHiddenCount,
      Page_Hidden_Total_ms: pageHiddenTotalMs
    };
    const lines = [CLEAN_CSV_COLUMNS.join(',')];
    rows.forEach(row=>{
      const exportRow = {...row, ...sessionMetrics};
      lines.push(CLEAN_CSV_COLUMNS.map(col=>csvEscape(exportRow[col])).join(','));
    });
    return lines.join('\r\n');
  }

  async function uploadFinalDataToDataPipe(csvString){
    if(!dataPipeConfigured()) throw new Error('DataPipe experiment ID 尚未配置。');

      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        experimentID:DATAPIPE_EXPERIMENT_ID,
        filename,
        data:csvString
      })
    });
    const result = await response.json().catch(()=>({}));
    if(!response.ok || result.message !== 'Success'){
      throw new Error(result.message || `DataPipe 数据上传失败（HTTP ${response.status}）`);
    }
    return {filename,result};
  }

  function prepareLocalBackup(csvString){

      const blob = new Blob([csvString.startsWith('\uFEFF') ? csvString : '\uFEFF'+csvString], {type:'text/csv;charset=utf-8;'});
      const link = document.createElement('a');
      const url = URL.createObjectURL(blob);
      link.href=url;
      link.download=fileName;
      link.style.visibility='hidden';
      document.body.appendChild(link);
      link.click();
      link.remove();
      URL.revokeObjectURL(url);
    };

  function handleVisibilityChange(){
    const now = Date.now();
    if(document.hidden){

      }
    } else if(pageHiddenStartedAtMs !== null){
      if(experimentIsActive()){
        pageHiddenTotalMs += Math.max(0, now-pageHiddenStartedAtMs);
      } else if(experimentEndedAtMs !== null){
        pageHiddenTotalMs += Math.max(0, experimentEndedAtMs-pageHiddenStartedAtMs);
      }
      pageHiddenStartedAtMs = null;
    }
  }

    return (experimentStartedAtMs !== null && experimentEndedAtMs !== null)
      ? Math.max(0,experimentEndedAtMs-experimentStartedAtMs) : null;
  }
  function formalTotalTimeMs(){

  const FIXED_TRIAL_TEMPLATE = [

  function validateFixedSequence(){
    const errors=[];
    const configCounts={HighAbility:0,LowAbility:0,HighEmotion:0,LowEmotion:0};
    const halfCounts=[{HighAbility:0,LowAbility:0,HighEmotion:0,LowEmotion:0},{HighAbility:0,LowAbility:0,HighEmotion:0,LowEmotion:0}];
    const sceneConfigSeen={1:new Set(),2:new Set(),3:new Set(),4:new Set(),5:new Set(),6:new Set()};

    FIXED_TRIAL_TEMPLATE.forEach((t,i)=>{
      configCounts[t.config]++;
      halfCounts[i<12?0:1][t.config]++;
      sceneConfigSeen[t.scene].add(t.config);
      if(i>0 && FIXED_TRIAL_TEMPLATE[i-1].scene===t.scene) errors.push(`Trial ${i}/${i+1} 场景连续重复`);
      if(i>0 && FIXED_TRIAL_TEMPLATE[i-1].config===t.config) errors.push(`Trial ${i}/${i+1} 助手条件连续重复`);
    });

    Object.entries(configCounts).forEach(([k,v])=>{ if(v!==6) errors.push(`${k} 总次数=${v}`); });
    halfCounts.forEach((h,idx)=>Object.entries(h).forEach(([k,v])=>{ if(v!==3) errors.push(`Half${idx+1} ${k}=${v}`); }));
    Object.entries(sceneConfigSeen).forEach(([s,set])=>{ if(set.size!==4) errors.push(`Scene ${s} 未覆盖4条件`); });

    if(errors.length) throw new Error('固定序列校验失败：'+errors.join('；'));

  /* =========================================================
     6. 图片后台滚动预加载（沿用3a思路）
     ========================================================= */
  const SCENE_PRELOAD_CONCURRENCY = 3;
  const scenePreloader = (()=>{
    let queue=[];
    let active=0;
    let running=false;
    const loaded=new Set();
    const loading=new Set();
    const queued=new Set();
    const failed=new Map();
    const waiters=new Map();

    function norm(file){
      const clean=String(file||'').replace(/^img\//,'').replace(/[^A-Za-z0-9_.-]/g,'');
      return `img/${clean}`;
    }
    function loadedCount(){ return loaded.size; }
    function isLoaded(file){ return loaded.has(norm(file)); }
    function notifySuccess(file){
      const list=waiters.get(file)||[];
      waiters.delete(file);
      list.forEach(w=>{try{w.ok();}catch(e){console.error(e);}});
    }
    function notifyFailure(file,error){
      const list=waiters.get(file)||[];
      waiters.delete(file);
      list.forEach(w=>{try{if(w.fail)w.fail(error);}catch(e){console.error(e);}});
    }
    function enqueue(files,front=false){
      const fresh=[];
      files.forEach(raw=>{
        const file=norm(raw);
        if(loaded.has(file)||loading.has(file)||queued.has(file)) return;
        queued.add(file); fresh.push(file);
      });
      queue=front?fresh.concat(queue):queue.concat(fresh);
      if(running) pump();
    }
    function prioritize(file){
      file=norm(file);
      if(loaded.has(file)||loading.has(file)) return;
      queue=queue.filter(x=>x!==file);
      queued.delete(file); queued.add(file); queue.unshift(file);
      if(running) pump();
    }
    function whenLoaded(file,ok,fail){
      file=norm(file);
      if(loaded.has(file)){ setTimeout(ok,0); return; }
      if(!waiters.has(file)) waiters.set(file,[]);
      waiters.get(file).push({ok,fail});
      prioritize(file);
    }
    function markLoaded(file){
      file=norm(file);
      if(loaded.has(file)) return;
      loaded.add(file); loading.delete(file); queued.delete(file); failed.delete(file); notifySuccess(file);
    }
    function launch(file){
      active++; loading.add(file); queued.delete(file);
      jsPsych.pluginAPI.preloadImages(
        [file],
        function(){
          active--; loading.delete(file); loaded.add(file); failed.delete(file); notifySuccess(file); pump();
        },
        function(){},
        function(errorInfo){
          active--; loading.delete(file);
          const tries=(failed.get(file)||0)+1;
          failed.set(file,tries);
          console.warn('[scene preload] error',file,errorInfo,'try',tries);
          if(tries<=2){
            setTimeout(()=>{
              if(!loaded.has(file)&&!loading.has(file)){ queued.add(file); queue.push(file); pump(); }
            },1500);
          }else{
            notifyFailure(file,errorInfo); pump();
          }
        }
      );
    }
    function pump(){
      if(!running) return;
      while(active<SCENE_PRELOAD_CONCURRENCY && queue.length>0){
        const file=queue.shift();
        if(loaded.has(file)||loading.has(file)){ queued.delete(file); continue; }
        launch(file);
      }
    }
    function start(files){ running=true; enqueue(files,false); pump(); }
    return {start,enqueue,prioritize,whenLoaded,markLoaded,isLoaded,loadedCount,normalize:norm};
  })();

  function createFormalResourceGateNode(requiredImages){
    const files=requiredImages.map(scenePreloader.normalize);
    const total=files.length;
    const waitTrial={
      type:jsPsychHtmlKeyboardResponse,
      choices:'NO_KEYS',
      stimulus:`<div class="fullscreen-container">
        <div class="guide-box" style="width:min(820px,90vw);">
          <div class="guide-title">正式体验准备中</div>
          <div class="context-box" style="text-align:center;">为保证接下来的驾驶体验连续流畅，系统正在准备剩余的驾驶场景。完成后会自动继续。</div>
          <div style="width:min(620px,80vw);margin:24px auto 8px;height:14px;background:var(--panel-deep);border:1px solid #555;border-radius:999px;overflow:hidden;">
            <div id="formal-resource-bar" style="height:100%;width:0%;background:var(--green);transition:width .25s ease;"></div>
          </div>
          <div id="formal-resource-count" style="text-align:center;color:#e0e0e0;font-size:20px;font-weight:bold;margin-top:10px;">准备中…</div>
          <div id="formal-resource-note" style="text-align:center;color:#9e9e9e;font-size:14px;line-height:1.6;margin-top:12px;">请保持当前页面开启。</div>
        </div>
      </div>`,
      data:{Event_Type:'Formal_Resource_Gate'},
      on_load:function(){
        const startedAt=Date.now();
        const bar=document.getElementById('formal-resource-bar');
        const count=document.getElementById('formal-resource-count');
        const note=document.getElementById('formal-resource-note');
        let finished=false;
        let retryTick=0;
        function missingFiles(){ return files.filter(f=>!scenePreloader.isLoaded(f)); }
        function refresh(){
          if(finished) return;
          const missing=missingFiles();
          const ready=total-missing.length;
          if(bar) bar.style.width=`${total?ready/total*100:100}%`;
          if(count) count.innerText=`驾驶场景已准备 ${ready} / ${total}`;
          if(note && Date.now()-startedAt>=60000) note.innerText='当前网络速度较慢，场景仍在继续准备，请保持页面开启。';
          if(missing.length===0){
            finished=true; clearInterval(pollTimer); clearInterval(retryTimer);
            if(count) count.innerHTML='<span style="color:var(--green);">驾驶场景准备完成</span>';
            if(note) note.innerText='即将进入正式体验…';
            setTimeout(()=>jsPsych.finishTrial({Event_Type:'Formal_Resource_Gate',Resource_Gate_Wait_ms:Date.now()-startedAt}),350);
          }
        }
        scenePreloader.enqueue(missingFiles(),true);
        const pollTimer=setInterval(refresh,250);
        const retryTimer=setInterval(()=>{
          retryTick++;
          const missing=missingFiles();
          if(missing.length>0){
            scenePreloader.enqueue(missing,true);
            if(retryTick%4===0 && note) note.innerText='场景仍在准备中，请保持页面开启，完成后会自动继续。';
          }
        },15000);
        refresh();
      }
    };
    return {timeline:[waitTrial],conditional_function:()=>files.some(f=>!scenePreloader.isLoaded(f))};
  }

  function createRatingTrialNode(trialData,isFormal=true){
    const q1='我完全信任这款智驾助手';
    const q2='在当前路况下，我愿意选择这款智驾助手完成这段行程';
    const buttons=[1,2,3,4,5].map(n=>`<button class="rating-option" data-score="${n}" disabled>${n}</button>`).join('');

    return {
      type:jsPsychHtmlKeyboardResponse,
      choices:'NO_KEYS',
      stimulus:`<div class="trial-shell">
        <div class="trial-header">
          <span>${isFormal?`正式体验 ${trialData.formalOrder} / 24`:trialData.practiceLabel}</span>
          <span>${isFormal?'请根据当前信息独立判断':'练习不计入正式结果'}</span>
        </div>
        <div class="scene-zone">${renderSceneImage(trialData.image)}</div>
        <div class="assistant-zone">${renderAssistantInfo(trialData,isFormal)}</div>
        <div class="rating-zone">
          <div class="rating-topline">
            <div id="rating-progress" class="rating-progress">第 1 题 / 共 2 题</div>
            <button id="rating-back" class="rating-back hidden-visibility" type="button">返回上一题</button>
          </div>
          <div id="rating-question" class="rating-question">${q1}</div>
          <div class="rating-options">${buttons}</div>
          <div class="rating-anchors"><span>1 非常不赞同</span><span>3 一般</span><span>5 非常赞同</span></div>
          <button id="rating-confirm" class="rating-confirm" disabled>确认并继续</button>
        </div>
      </div>`,
      on_load:function(){
        let totalStart=null;
        let phase=1;
        let phaseStart=null;
        let trustDraft=null,coopDraft=null;
        let trustScore=null,coopScore=null;
        let trustRT=0,coopRT=0;
        let backToQ1Count=0;

        const shell=document.querySelector('.trial-shell');
        const options=Array.from(document.querySelectorAll('.rating-option'));
        const confirm=document.getElementById('rating-confirm');
        const back=document.getElementById('rating-back');
        const q=document.getElementById('rating-question');
        const progress=document.getElementById('rating-progress');
        const sceneImg=document.getElementById('scene-image');
        const sceneHint=document.getElementById('scene-load-hint');
        const imagePath=sceneImg?sceneImg.dataset.src:`img/${trialData.image}`;
        let sceneReady=false;
        let resizeObserver=null;

        function elementIsClipped(el){
          if(!el) return false;
          return (el.scrollHeight-el.clientHeight>2)||(el.scrollWidth-el.clientWidth>2);
        }
        function enableAdaptiveLayoutIfNeeded(){
          if(!shell || shell.classList.contains('adaptive-scroll')) return;
          const viewportH=window.visualViewport?window.visualViewport.height:window.innerHeight;
          const clipped=Array.from(shell.children).some(elementIsClipped) || elementIsClipped(q);
          if(clipped || shell.scrollHeight>viewportH+3) shell.classList.add('adaptive-scroll');
        }
        requestAnimationFrame(()=>requestAnimationFrame(enableAdaptiveLayoutIfNeeded));
        if('ResizeObserver' in window && shell){
          resizeObserver=new ResizeObserver(enableAdaptiveLayoutIfNeeded);
          resizeObserver.observe(shell);
          Array.from(shell.children).forEach(x=>resizeObserver.observe(x));
        }

        function enableRatingsAfterImage(){
          if(sceneReady) return;
          sceneReady=true;
          totalStart=Date.now();
          phaseStart=totalStart;
          scenePreloader.markLoaded(imagePath);
          if(sceneHint) sceneHint.style.display='none';
          options.forEach(btn=>btn.disabled=false);
          requestAnimationFrame(enableAdaptiveLayoutIfNeeded);
        }
        function showImageError(error){
          sceneReady=false;
          options.forEach(btn=>btn.disabled=true);
          confirm.disabled=true;
          if(sceneHint){
            sceneHint.style.display='flex';
            sceneHint.style.color='var(--warning)';
            sceneHint.innerText='当前驾驶场景暂未加载成功，正在重试…';
          }
          console.error('trial image load error',imagePath,error);
          setTimeout(requestCurrentImage,1800);
        }
        function attachActualImage(){
          if(!sceneImg || sceneReady) return;
          sceneImg.addEventListener('load',enableRatingsAfterImage,{once:true});
          sceneImg.addEventListener('error',showImageError,{once:true});
          sceneImg.src=imagePath;
          if(sceneImg.complete && sceneImg.naturalWidth>0) enableRatingsAfterImage();
        }
        function requestCurrentImage(){
          if(!sceneImg || sceneReady) return;
          if(scenePreloader.isLoaded(imagePath)){ attachActualImage(); return; }
          if(sceneHint){sceneHint.style.display='flex';sceneHint.innerText='正在准备当前驾驶场景，请稍候…';}
          scenePreloader.whenLoaded(imagePath,attachActualImage,attachActualImage);
        }
        requestCurrentImage();

        function setSelected(score){
          options.forEach(btn=>btn.classList.toggle('selected',Number(btn.dataset.score)===score));
          confirm.disabled=score===null;
        }
        options.forEach(btn=>btn.addEventListener('click',()=>{
          const score=Number(btn.dataset.score);
          if(phase===1) trustDraft=score; else coopDraft=score;
          setSelected(score);
        }));

        back.addEventListener('click',()=>{
          if(phase!==2) return;
          // 第二题尚未最终提交，因此允许返回修正第一题。
          // 返回后第一题 RT 重新计时，以最终确认答案为准。
          coopDraft=null;
          backToQ1Count++;
          phase=1;
          q.innerText=q1;
          progress.innerText='第 1 题 / 共 2 题';
          back.classList.add('hidden-visibility');
          phaseStart=Date.now();
          setSelected(trustDraft);
        });

        confirm.addEventListener('click',()=>{
          if(phase===1){
            if(trustDraft===null) return;
            trustScore=trustDraft;
            trustRT=Date.now()-phaseStart;
            phase=2;
            q.innerText=q2;
            progress.innerText='第 2 题 / 共 2 题';
            back.classList.remove('hidden-visibility');
            phaseStart=Date.now();
            setSelected(coopDraft);
            requestAnimationFrame(enableAdaptiveLayoutIfNeeded);
          }else{
            if(coopDraft===null) return;
            coopScore=coopDraft;
            coopRT=Date.now()-phaseStart;
            if(resizeObserver) resizeObserver.disconnect();

            const imageBase=String(trialData.image||'').replace(/\.[^.]+$/,'');
            const imageNumber=(String(trialData.image||'').match(/(\d+)/)||[])[1]||'';

            jsPsych.finishTrial({
              Event_Type:isFormal?'Formal_Trial':'Practice_Trial',
              Subject_ID:currentSubjectId,
              Session_UUID:sessionUUID,
              Age_Group:AGE_GROUP,
              DataPipe_Condition:dataPipeCondition,
              Version:currentVersion,
              Sequence:SEQUENCE_NAME,
              Formal_Trial_Order:isFormal?trialData.formalOrder:0,
              Block:isFormal?trialData.block:0,
              Block_Position:isFormal?trialData.blockPosition:0,
              Image_Number:imageNumber,
              Image_ID:imageBase,
              Image_File:trialData.image,
              Scene_ID:trialData.sceneId,
              Scene_Name:trialData.sceneName,
              Risk_Level:isFormal?trialData.risk:'Practice',
              Assistant_Label:isFormal?trialData.assistantLabel:'Practice',
              Config_Code:trialData.config.code,
              Config_Type:trialData.config.key,
              Config_Name_CN:trialData.config.internalName,
              Attribute_Dimension:trialData.config.dimension,
              Attribute_Level:trialData.config.level,
              Attribute_Level_Numeric:trialData.config.levelNumeric,
              Manipulation_Text:trialData.manipulationText,
              Trust_Score:trustScore,
              Trust_RT_ms:trustRT,
              Cooperation_Score:coopScore,
              Cooperation_RT_ms:coopRT,
              Back_to_Q1_Count:backToQ1Count,
              Total_Trial_Time_ms:totalStart===null?null:Date.now()-totalStart,
              Baseline_Ability_Points:baselineAbility,
              Baseline_Emotion_Points:baselineEmotion,
              Browser_Context:getBrowserContext(),
              User_Agent:navigator.userAgent||'',
              Image_Format:IMAGE_FORMAT
            });
          }
        });
      }
    };
  }

  function getParticipantIdFromURL(){
    const params=new URLSearchParams(window.location.search);
    const pid=(params.get('pid')||'').trim();
    return /^[A-Za-z0-9_-]{1,30}$/.test(pid)?pid:'';
  }
  function applyParticipantIdFromURL(){
    const pid=getParticipantIdFromURL();
    if(!pid) return;
    const input=document.getElementById('subject-id-input');
    if(input){input.value=pid;input.readOnly=true;input.style.opacity='0.92';}
    const info=document.getElementById('login-info');
    if(info) info.innerHTML=`已从前置页面自动识别实验编号：<b style="color:#fff;">${pid}</b><br><span style="font-size:13px;color:#8f9aa5;">请确认后点击“进入体验”。</span>`;
  }
  applyParticipantIdFromURL();

  document.getElementById('login-btn').addEventListener('click',startExperiment);

  async function startExperiment(){
    const inputVal=document.getElementById('subject-id-input').value.trim();
    if(!inputVal || !/^[A-Za-z0-9_-]{1,30}$/.test(inputVal)){
      alert('请输入有效的实验编号（仅使用字母、数字、下划线或短横线）。');
      return;
    }
    currentSubjectId=inputVal;

    const startButton=document.getElementById('login-btn');
    const originalButtonText=startButton.innerText;
    startButton.disabled=true;
    startButton.innerText='正在连接实验服务器…';

    try{
      dataPipeCondition=await getDataPipeCondition();
    }catch(error){
      console.error(error);
      startButton.disabled=false;
      startButton.innerText=originalButtonText;
      if(DATAPIPE_REQUIRED){
        alert('暂时无法连接实验服务器或获取实验条件，请检查网络后重试。\n\n'+(error.message||error));
        return;
      }
      dataPipeCondition=0;
    }

    riskGroup=dataPipeCondition===0?'Low':'High';
    currentVersion=`Exp1b_Adult_DP${dataPipeCondition}_${riskGroup}_${SEQUENCE_NAME}`;

    jsPsych.data.addProperties({
      Subject_ID:currentSubjectId,
      Session_UUID:sessionUUID,
      Age_Group:AGE_GROUP,
      DataPipe_Condition:dataPipeCondition,
      Version:currentVersion,
      Sequence:SEQUENCE_NAME,
      Risk_Level:riskGroup,
      Browser_Context:getBrowserContext(),
      User_Agent:navigator.userAgent||'',
      Image_Format:IMAGE_FORMAT
    });

    experimentStartedAtMs=Date.now();
    document.getElementById('login-screen').classList.add('hidden');
    document.getElementById('jspsych-target').innerHTML='';

    const formalTrials=buildFormalTrials();

    // 两个练习使用同一张拥堵图片，只改变状态类型与助手提示。
    const practiceAbility={
      image:'test.webp', sceneId:0, sceneName:'练习拥堵场景', practiceLabel:'练习 1 / 2',
      config:{key:'PracticeAbility',code:'PRA',dimension:'Ability',level:'Practice',levelNumeric:2,internalName:'能力练习'},
      manipulationText:'当前道路出现拥堵，系统已根据前方车流调整车速与车距，保持车辆平稳行驶。'
    };
    const practiceEmotion={
      image:'test.webp', sceneId:0, sceneName:'练习拥堵场景', practiceLabel:'练习 2 / 2',
      config:{key:'PracticeEmotion',code:'PRE',dimension:'Emotion',level:'Practice',levelNumeric:2,internalName:'情感练习'},
      manipulationText:'当前道路有些拥堵，我已经调整好车速。您现在感觉还好吗？如果有需要，请告诉我。'
    };

    // 仅加载该被试风险组真正会使用的6张正式图 + 1张练习图。
    const uniqueFormalImages=[...new Set(formalTrials.map(t=>`img/${t.image}`))];
    const scenePriorityQueue=['img/test.webp',...uniqueFormalImages];
    scenePreloader.start(scenePriorityQueue);

    const timeline=[];
    timeline.push(createWelcomeNode());
    timeline.push(createAllocationNode());
    timeline.push(createAssistantIntroNode());
    timeline.push(createPracticeInstructionNode());
    timeline.push(createRatingTrialNode(practiceAbility,false));
    timeline.push(createRatingTrialNode(practiceEmotion,false));
    timeline.push(createFormalResourceGateNode(scenePriorityQueue));
    timeline.push(createFormalInstructionNode());

    formalTrials.forEach((trial,i)=>{
      timeline.push(createRatingTrialNode(trial,true));
      if(i===11) timeline.push(createRestNode());
    });

    jsPsych.run(timeline);
  }

</script>
